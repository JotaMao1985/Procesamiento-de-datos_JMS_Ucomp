<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="100%" role="img"
          aria-labelledby="sac-titulo sac-desc">
          <title id="sac-titulo">Patrón dividir, aplicar, combinar</title>
          <desc id="sac-desc">Una tabla de ventas con ciudades mezcladas se divide en un grupo por ciudad, a cada grupo
            se le suma el total y los resultados se combinan en una tabla con una fila por ciudad.</desc>
