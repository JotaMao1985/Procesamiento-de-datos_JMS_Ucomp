<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" role="img" aria-labelledby="arq-titulo arq-desc">
          <title id="arq-titulo">Arquitectura de una aplicación de Spark</title>
          <desc id="arq-desc">El driver, con la SparkSession, convierte el programa en tareas y le pide recursos al
            gestor del clúster. El gestor asigna ejecutores en los nodos de trabajo. Cada ejecutor corre varias tareas,
            una por partición, y guarda datos en caché. Los ejecutores leen los datos de HDFS o del almacenamiento en la
            nube.</desc>
          <defs>
            <marker id="arq-flecha" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
              <path d="M0,0 L7,3 L0,6 z" fill="#64748b" />
            </marker>
          </defs>
          <rect x="15" y="95" width="190" height="110" rx="10" fill="#691E7A" />
          <g fill="#fff" text-anchor="middle">
            <text x="110" y="128" font-size="15" font-weight="700">Driver</text>
            <text x="110" y="150" font-size="11.5">SparkSession · tu programa</text>
            <text x="110" y="168" font-size="11.5">arma el plan y lo parte</text>
            <text x="110" y="186" font-size="11.5">en etapas y tareas</text>
          </g>
          <rect x="265" y="20" width="190" height="60" rx="10" fill="#FFF1E6" stroke="#F46201" />
          <g text-anchor="middle" fill="#1F2933">
            <text x="360" y="45" font-size="13.5" font-weight="700">Gestor del clúster</text>
            <text x="360" y="64" font-size="11">local · standalone · YARN · Kubernetes</text>
          </g>
          <g>
            <rect x="265" y="110" width="190" height="80" rx="10" fill="#F3E9F5" stroke="#691E7A" />
            <rect x="265" y="205" width="190" height="80" rx="10" fill="#F3E9F5" stroke="#691E7A" />
          </g>
          <g font-size="12.5" font-weight="700" fill="#3A0F47">
            <text x="278" y="130">Ejecutor 1 · nodo A</text>
            <text x="278" y="225">Ejecutor 2 · nodo B</text>
          </g>
          <g fill="#691E7A">
            <rect x="278" y="140" width="50" height="22" rx="4" />
            <rect x="334" y="140" width="50" height="22" rx="4" />
            <rect x="278" y="235" width="50" height="22" rx="4" />
            <rect x="334" y="235" width="50" height="22" rx="4" />
          </g>
          <g fill="#fff" font-size="10.5" text-anchor="middle">
            <text x="303" y="155">tarea</text><text x="359" y="155">tarea</text>
            <text x="303" y="250">tarea</text><text x="359" y="250">tarea</text>
          </g>
          <g fill="#FAA012">
            <rect x="392" y="140" width="52" height="22" rx="4" />
            <rect x="392" y="235" width="52" height="22" rx="4" />
          </g>
          <g fill="#3A0F47" font-size="10.5" text-anchor="middle">
            <text x="418" y="155">caché</text><text x="418" y="250">caché</text>
          </g>
          <g font-size="10" fill="#566B7F">
            <text x="278" y="180">una tarea por partición</text>
            <text x="278" y="275">una tarea por partición</text>
          </g>
          <rect x="530" y="110" width="175" height="175" rx="10" fill="#E9EEF2" stroke="#566B7F" />
          <g text-anchor="middle" fill="#1F2933">
            <text x="617" y="140" font-size="13.5" font-weight="700">Datos</text>
            <text x="617" y="165" font-size="11.5">HDFS</text>
            <text x="617" y="185" font-size="11.5">S3 · GCS · ADLS</text>
            <text x="617" y="205" font-size="11.5">bases de datos</text>
            <text x="617" y="225" font-size="11.5">Parquet · CSV · JSON</text>
          </g>
          <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arq-flecha)">
            <path d="M205 120 C 235 90, 240 60, 262 52" />
            <line x1="360" y1="80" x2="360" y2="107" />
            <path d="M205 150 L 262 150" />
            <path d="M205 180 C 235 200, 240 240, 262 245" />
            <line x1="455" y1="150" x2="527" y2="170" />
            <line x1="455" y1="245" x2="527" y2="225" />
          </g>
          <g font-size="10" fill="#64748b">
            <text x="210" y="80">pide recursos</text>
            <text x="212" y="143">envía tareas</text>
            <text x="470" y="150">lee</text>
            <text x="366" y="99">asigna ejecutores</text>
          </g>
        </svg>
