      <p>Una empresa no decide con datos: decide con <strong>información confiable</strong> que alguien obtuvo a
        partir de datos. Entre el registro crudo que deja una caja registradora y el gráfico que mira la gerencia hay
        un trabajo silencioso —recopilar, limpiar, transformar, verificar, guardar— que es el tema de este curso.
        Cuando los datos son muchos, llegan rápido o vienen en formatos distintos, ese trabajo ya no cabe en un solo
        computador, y ahí aparecen la nube, Hadoop y Spark.</p>

      <div class="definition">
        <h4><i class="fas fa-award mr-2" aria-hidden="true"></i>Competencia y resultado de aprendizaje del curso</h4>
        <p><strong>Competencia.</strong> Gestiona, visualiza y asegura grandes volúmenes de datos estructurados,
          semiestructurados o no estructurados, provenientes de diferentes fuentes de información, utilizando
          procesos de extracción, transformación, análisis, interpretación y visualización con el fin de integrarlos
          y detectar patrones, relaciones, tendencias o posibilidades que faciliten la toma de decisiones en el ámbito
          empresarial en el cual se aplique.</p>
        <p style="margin-bottom:0;"><strong>Resultado de aprendizaje.</strong> Procesa y evalúa resultados
          cuantitativos y cualitativos para establecer controles de seguridad, eficiencia, coherencia y correlación,
          de acuerdo con la metodología y las políticas de datos, dando cumplimiento a los aspectos éticos y legales
          vigentes para la confiabilidad de los datos.</p>

      <h3>Cómo trabajaremos</h3>
      <p>El curso sigue el <strong>aprendizaje basado en problemas</strong>: un mismo caso —<em>Tiendas Guadua
