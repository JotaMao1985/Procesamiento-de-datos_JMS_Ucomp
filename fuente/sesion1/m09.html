      <p>La propuesta de Dean y Ghemawat (2004) fue tan simple como poderosa: quien programa escribe <strong>solo dos
          funciones</strong>, <code>map</code> y <code>reduce</code>, y el sistema se encarga de todo lo difícil —partir
        los datos, repartir el trabajo entre cientos de máquinas, reintentar lo que falle y juntar los resultados—.</p>

      <div class="formula">
        $$\text{map}: (k_1, v_1) \rightarrow \text{lista}(k_2, v_2)
        \qquad
        \text{reduce}: \big(k_2, \text{lista}(v_2)\big) \rightarrow \text{lista}(v_2)$$
      </div>

      <p>Leído en castellano: <code>map</code> toma un registro y emite pares <em>clave–valor</em>; el sistema agrupa
        todos los valores que comparten clave; <code>reduce</code> recibe una clave con su lista de valores y la
        resume. El ejemplo canónico es contar palabras. Con tres fragmentos de reseñas:</p>

        <p class="leyenda-diagrama">Cada mapper ve solo su bloque. En el shuffle, los pares intermedios viajan por la
          red de un nodo a otro: cada par va al reducer de su partición (en el dibujo, morado a la 1 y naranja a la 2), y
          así cada reducer recibe <em>todas</em> las apariciones de sus claves.</p>

      <div class="definition">
        <h4><i class="fas fa-diagram-project mr-2" aria-hidden="true"></i>Las fases, una por una</h4>
        <ol style="margin-bottom:0;">
          <li><strong>Entrada</strong> (<em>input split</em>): el archivo de HDFS se divide en fragmentos, normalmente
            uno por bloque. Cada fragmento lo procesa una tarea map, en lo posible en el nodo que guarda el bloque.</li>
          <li><strong>Map</strong>: la función del programador se aplica a cada registro y emite pares
            <code>(clave, valor)</code>. Los mappers no se hablan entre sí.</li>
          <li><strong>Combine</strong> (opcional): un «mini reduce» local que suma dentro de cada mapper antes de
            enviar, para que viajen menos pares por la red.</li>
          <li><strong>Shuffle y orden</strong>: cada par se envía al reducer que le corresponde
            —normalmente <code>hash(clave) mod R</code>, con R reducers— y allí se ordenan por clave.</li>
          <li><strong>Reduce</strong>: la segunda función del programador recibe cada clave con la lista de sus valores y
            produce el resultado.</li>
          <li><strong>Salida</strong>: cada reducer escribe su parte en HDFS.</li>
        </ol>
      </div>

      <p>Un sistema de Big Data se organiza como una tubería de tres tramos. Cada herramienta del ecosistema vive en
