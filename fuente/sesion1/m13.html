        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">Transformar y resumir

            <p class="text-gray-600 text-sm" style="margin:0;">Derivar columnas, unir tablas y resumir con
              <code>groupby</code> y tablas dinámicas para responder las preguntas de la gerencia.</p>

      <p>Con la tabla limpia, el procesamiento propiamente dicho son tres movimientos: <strong>derivar</strong>
        columnas nuevas a partir de las que hay, <strong>unir</strong> con otras tablas para traer contexto y
        <strong>resumir</strong> por grupos.</p>

      <h3>Derivar: el total de cada venta</h3>
      {{CELDA:derivadas}}
      <p>Las operaciones entre columnas se hacen fila a fila sin escribir ningún ciclo: pandas multiplica las tres
        columnas completas a la vez. El accesor <code>.dt</code> da acceso a las partes de una fecha:
        <code>strftime("%Y-%m")</code> la vuelve el texto <code>2025-01</code>, útil para agrupar por mes, y
        <code>dayofweek</code> da el día como número (0 = lunes), que el diccionario <code>dict(enumerate(DIAS))</code>
        —<code>{0: "lunes", 1: "martes", …}</code>— traduce.</p>

      <h3>Unir: traer el nombre y la categoría del catálogo</h3>
      {{CELDA:union}}
      <p><code>merge</code> es el <code>JOIN</code> de SQL. Dos detalles de control: <code>how="left"</code> conserva
        todas las ventas aunque un producto no esté en el catálogo (y el conteo de vacíos lo delataría), y
        <code>validate="many_to_one"</code> hace que pandas se detenga con error si el catálogo tuviera un producto
        repetido, que multiplicaría las ventas en silencio.</p>

      <h3>Resumir: dividir, aplicar, combinar</h3>
      <p>Casi todo resumen sigue el mismo patrón, que Hadley Wickham (2011) llamó <em>split–apply–combine</em>:
        <strong>dividir</strong> las filas en grupos según una clave, <strong>aplicar</strong> un cálculo a cada grupo
        y <strong>combinar</strong> los resultados en una tabla.</p>

        <p class="leyenda-diagrama">¿Te suena? Es MapReduce (módulo 9): dividir por clave es lo que hacen el
          <em>map</em>, que asigna a cada registro su clave, y el <em>shuffle</em>, que junta los de la misma clave;
          aplicar a cada grupo es el <em>reduce</em>. El <code>groupby</code> de pandas es un MapReduce en una sola
          máquina.</p>

      {{CELDA:por_ciudad}}
      <p>Con <code>agg</code> se piden varios resúmenes a la vez, cada uno con su nombre. {{CIFRA:ciudad_top}} vende
        {{CIFRA:ciudad_top_millones}} millones de pesos, el {{CIFRA:ciudad_top_pct}} % del total de
        {{CIFRA:total_millones}} millones del semestre.</p>

      <h3>Dos dimensiones a la vez: la tabla dinámica</h3>
      {{CELDA:pivote}}
      <p><code>pivot_table</code> es la tabla dinámica de Excel en una línea: filas por categoría, columnas por canal,
        valores sumados, y <code>margins=True</code> agrega los totales.</p>

      <h3>La pregunta de la app</h3>
      {{CELDA:app_mes}}
      <p><code>crosstab</code> con <code>normalize="index"</code> convierte cada fila en porcentajes que suman 100.
        La respuesta a la tercera pregunta de la gerencia es <strong>sí</strong>: la app pasó del {{CIFRA:app_ene}} % de
        las ventas en enero al {{CIFRA:app_jun}} % en junio, y lo hizo quitándole terreno sobre todo a la tienda
        física.</p>

      <div class="warning">
        <p style="margin-bottom:0;"><strong>Información no es causa.</strong> Que la app crezca no dice <em>por
            qué</em> crece: puede ser una campaña, un cambio de hábitos o que las tiendas abrieron menos horas. Pasar
          de la información al conocimiento (módulo 2) exige más datos y más preguntas, y con frecuencia, las palabras
          de los propios clientes.</p>
      </div>
