      <p>En el módulo 13 obtuvimos el total por ciudad con una línea de <code>groupby</code>. Ahora lo haremos como lo
        haría un clúster: partiendo los datos en bloques, procesando cada bloque por separado y juntando al final.</p>

      <h3>Bloques, map con combiner y reduce</h3>
      {{CELDA:mr_ventas}}
      <p>Los {{CIFRA:filas_limpias}} registros se parten en cuatro bloques de hasta {{CIFRA:filas_bloque}} filas,
        como HDFS parte un archivo en bloques de 128 MB (HDFS corta por tamaño, no por filas, pero la idea es la misma).
        Cada bloque produce un diccionario de <strong>subtotales por ciudad</strong> —el <em>combiner</em>—, así que lo
        que «viaja» al reduce son a lo sumo siete subtotales por bloque en lugar de {{CIFRA:filas_bloque}} pares
        (ciudad, total). El reduce suma los subtotales: funciona porque la suma es asociativa y conmutativa (módulo
        14).</p>

      <h3>Control de coherencia</h3>
      {{CELDA:mr_verifica}}
      <p>Dos caminos independientes, el mismo resultado hasta el último decimal. Este tipo de verificación cruzada es
        la que pide el criterio CR3: cuando el procesamiento corra en un clúster que no podemos inspeccionar a mano,
        compararlo contra una muestra procesada por otra vía es la mejor garantía de que la lógica es correcta.</p>

      <h3>Mapper y reducer como programas: Hadoop Streaming</h3>
      <p>Hadoop está escrito en Java, pero su modo <strong>Streaming</strong> permite usar como mapper y reducer
        cualquier programa que lea líneas de texto por la entrada estándar y escriba líneas
        <code>clave&lt;TAB&gt;valor</code> por la salida estándar. Python sirve. Primero exportamos solo las dos
        columnas que necesita el trabajo:</p>

      {{CELDA:exporta}}

      <p>La celda mágica <code>%%writefile</code> de Jupyter (y por tanto de Colab) guarda el contenido de la celda en un archivo, en lugar de
        ejecutarlo.</p>

      {{CELDA:mapper_py}}

      <p>El reducer aprovecha una garantía de Hadoop: <strong>recibe las líneas ordenadas por clave</strong>. Por eso
        no necesita un diccionario: acumula mientras la clave no cambie y, cuando cambia, imprime el total de la
        anterior. Así puede procesar millones de líneas con memoria constante.</p>

      {{CELDA:reducer_py}}

      <p>Y ahora la prueba de fuego, con tuberías de Unix: la salida de cada programa es la entrada del siguiente, y
        <code>sort</code> hace de shuffle: ordena las líneas completas y, como cada una empieza por su clave, las de una
        misma ciudad quedan juntas, que es justo lo que necesita el reducer.</p>

      {{CELDA:streaming}}

      <p>Los mismos totales que el <code>groupby</code> y que el MapReduce en memoria, ahora en pesos y ordenados por
        clave, como los entregaría Hadoop.</p>

      <p>En la sesión 2 ejecutaremos <em>exactamente estos dos archivos</em> en Hadoop, con una orden de este estilo

      <pre><code class="language-bash">hadoop jar hadoop-streaming.jar \
  -files mapper.py,reducer.py \
  -input /guadua/limpio/ventas_limpias.csv \
  -output /guadua/resultados/por_ciudad \
  -mapper "python3 mapper.py" \
  -reducer "python3 reducer.py"</code></pre>
