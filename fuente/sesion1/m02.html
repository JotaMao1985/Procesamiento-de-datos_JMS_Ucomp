      <p>Una fila de un archivo de ventas no le dice nada a nadie: <code>V00002, 2025-01-01, Barranquilla, Tienda,
          C0182, P011, 3, 16900</code>. Son <strong>datos</strong>: registros de hechos, concretos pero mudos. Cuando
        se agrupan, se suman y se ponen en contexto —«Bogotá concentra el {{CIFRA:ciudad_top_pct}} % de las ventas del
        semestre», «la app pasó del {{CIFRA:app_ene}} % al {{CIFRA:app_jun}} % de las ventas entre enero y junio»— se
        vuelven <strong>información</strong>. Y cuando se descubre un patrón que explica o anticipa —«la app le gana
        terreno a la tienda física y, si la tendencia sigue, la alcanzará»— aparece el <strong>conocimiento</strong>,
        que es lo que permite tomar una <strong>decisión</strong>.</p>

        <p class="leyenda-diagrama">Cada escalón se construye procesando el anterior. El procesamiento de datos es,

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Tres palabras que no son sinónimos</h4>
        <ul style="margin-bottom:0;">
          <li><strong>Dato</strong> (<em>data</em>): representación de un hecho —un número, un texto, una fecha—
            registrada sin interpretación.</li>
          <li><strong>Información</strong> (<em>information</em>): datos procesados y puestos en contexto que
            responden <em>qué</em>, <em>cuánto</em>, <em>dónde</em> o <em>cuándo</em>.</li>
          <li><strong>Conocimiento</strong> (<em>knowledge</em>): relaciones y patrones extraídos de la información
            que explican <em>por qué</em> ocurre algo o permiten anticipar <em>qué</em> ocurrirá.</li>
        </ul>
      </div>

      <div class="warning">
        <p style="margin-bottom:0;"><strong>Basura entra, basura sale</strong> (<em>garbage in, garbage out</em>). Si
          en el paso de datos a información se cuela una venta duplicada, una ciudad escrita de varias formas o un
          precio guardado como texto, todo lo que se construya encima —el gráfico, el patrón, la decisión— hereda el
          error, y con más autoridad que antes porque ya «viene de los datos». Por eso la mitad de este curso trata de
          <em>calidad</em>.</p>
      </div>
