          <tr><td><strong>Dato personal</strong> (<em>personal data</em>)</td><td>Cualquier información vinculada o que pueda asociarse a una o varias personas naturales determinadas o determinables (Ley 1581 de 2012, art. 3).</td></tr>
          <tr><td><strong>Responsable / encargado del tratamiento</strong> (<em>controller / processor</em>)</td><td>Quien decide sobre la base de datos y su tratamiento / quien trata los datos por cuenta del responsable, como un proveedor de nube (Ley 1581 de 2012, art. 3).</td></tr>
          <tr><td><strong>Minimización</strong> (<em>data minimisation</em>)</td><td>Recoger solo los datos pertinentes y adecuados para la finalidad (Decreto 1074 de 2015, art. 2.2.2.25.2.1).</td></tr>

          <tr><td><strong>YARN</strong> (<em>Yet Another Resource Negotiator</em>)</td><td>Gestor de recursos de Hadoop: reparte CPU y memoria entre las aplicaciones.</td></tr>
          <tr><td><strong>Job / tarea</strong> (<em>job / task</em>)</td><td>Un trabajo completo enviado al clúster, como un MapReduce / cada una de las piezas en que se divide —tareas map y reduce—, que corren en paralelo en distintos nodos.</td></tr>
          <tr><td><strong>Split de entrada</strong> (<em>input split</em>)</td><td>Fragmento de la entrada que procesa una tarea map; normalmente coincide con un bloque de HDFS.</td></tr>

          <tr><td><strong>Combiner</strong></td><td>Reducción local, opcional, de la salida de cada mapper para enviar menos pares por la red. Hadoop puede ejecutarlo cero, una o varias veces: solo sirve para operaciones asociativas y conmutativas, como la suma.</td></tr>
          <tr><td><strong>Shuffle</strong> (<em>shuffle and sort</em>)</td><td>Fase en que los pares viajan por la red y se agrupan y ordenan por clave.</td></tr>
          <tr><td><strong>Partición</strong> (<em>partition</em>)</td><td>En MapReduce, el grupo de claves que recibe un mismo reducer: por defecto, hash(clave) mod R. En la sesión 2 la palabra tiene otros dos sentidos.</td></tr>
          <tr><td><strong>Series / DataFrame</strong></td><td>En pandas, una columna de valores con su índice / una tabla de columnas con nombre, todas del mismo largo.</td></tr>
          <tr><td><strong>Calidad del dato</strong> (<em>data quality</em>)</td><td>Grado en que el dato sirve para su uso. DAMA UK (2013) la mide en seis dimensiones: unicidad, consistencia, validez, exactitud, completitud y oportunidad.</td></tr>

          <tr><td><strong>Dividir, aplicar, combinar</strong> (<em>split–apply–combine</em>)</td><td>Patrón de resumen por grupos (Wickham, 2011): dividir por clave, aplicar un cálculo a cada grupo y combinar los resultados; es lo que hacen <code>groupby</code> y MapReduce.</td></tr>
          <tr><td><strong>Palabras vacías</strong> (<em>stopwords</em>)</td><td>Palabras muy frecuentes y sin contenido propio (artículos, preposiciones) que se descartan al analizar texto.</td></tr>
          <tr><td><strong>Sesgo de datos</strong> (<em>data skew</em>)</td><td>Reparto desigual del trabajo: una clave muy frecuente sobrecarga al reducer que la recibe.</td></tr>
