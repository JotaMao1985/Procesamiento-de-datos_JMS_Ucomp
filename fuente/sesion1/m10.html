      <h3>De la lista a la tabla: el DataFrame</h3>
      <div class="definition">
        <h4><i class="fas fa-table-cells mr-2" aria-hidden="true"></i>Series y DataFrame</h4>
        <p style="margin-bottom:0;">En <strong>pandas</strong>, la biblioteca de Python para datos tabulares, una
          <strong>Series</strong> es una columna —valores de un mismo tipo con un índice— y un
          <strong>DataFrame</strong> es una tabla: varias Series del mismo largo, cada una con su nombre. Casi todo lo
          que hace una hoja de cálculo lo hace un DataFrame, pero escrito, repetible y con millones de filas.</p>
      </div>

      {{CELDA:py_pandas}}

      <p>La última línea <strong>filtra</strong>: <code>mini["monto"] &gt; 80_000</code> produce una columna de
        <code>True</code>/<code>False</code> —una <em>máscara</em>— y <code>mini[máscara]</code> se queda solo con las
        filas verdaderas. Para combinar condiciones, pandas usa <code>&amp;</code> («y»), <code>|</code> («o») y
        <code>~</code> («no»): los verás en la limpieza del módulo 12.</p>

      <div class="note">
        <p style="margin-bottom:0;"><strong>Por qué pandas y no una hoja de cálculo.</strong> Una hoja de cálculo guarda
          el <em>resultado</em>; un script guarda el <em>procedimiento</em>. Si el próximo semestre llega otro
          consolidado igual de sucio, el mismo código lo limpia en segundos y deja constancia de cada paso: eso es
          trazabilidad, la base de los controles de coherencia que pide el criterio CR3.</p>
