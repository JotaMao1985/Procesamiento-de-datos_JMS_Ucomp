      <h3>¿Cuánto vendimos por ciudad?</h3>

      <h3>¿Y por categoría? Un <code>JOIN</code> con la dimensión</h3>
      <p>La categoría no está en la tabla de hechos: hay que unirla con <code>productos</code>. La participación usa
        una ventana sobre todo el resultado (<code>OVER ()</code>): la suma de las sumas.</p>
      {{CELDA:sql_categoria}}

      <h3>¿Está ganando terreno la app?</h3>
      {{CELDA:sql_app}}
      <p>Sí: del {{CIFRA:app_ene}} % del valor vendido en enero al {{CIFRA:app_jun}} % en junio, con un bajón en marzo.
        Es la misma cifra de la sesión 1, ahora en una consulta SQL que cualquiera puede volver a correr el mes
        próximo.</p>

      <h3>Una CTE y una ventana: el acumulado de cada canal</h3>
      <p>Una <strong>CTE</strong> (<code>WITH … AS</code>) le da nombre a una consulta intermedia para usarla como si
        fuera una tabla: hace legibles las consultas largas. Encima, una ventana por canal calcula el acumulado mes a
        mes.</p>
      {{CELDA:sql_acumulado}}
      <p>La tienda sigue siendo el canal que más vende en el semestre, pero termina junio por debajo de enero; la app
        sube todos los meses. Es la lectura de la sesión 1 —la app gana terreno sobre todo frente a la tienda— vista
        ahora en pesos y no en porcentajes.</p>

      <h3>¿Cuánto cuesta una consulta? El plan de ejecución</h3>
      <p><code>EXPLAIN</code> muestra el plan que Spark va a ejecutar, sin ejecutarlo. Filtremos un solo mes.
        <strong>Antes de ejecutar:</strong> ¿cuántas carpetas de meses abrirá Spark para esta consulta? ¿Y cuántas
        columnas leerá?</p>
      {{CELDA:sql_explain}}
      <ul>
        <li><strong>Location</strong>: Spark solo abrirá la carpeta <code>mes=2025-06</code>. Las otras cinco ni se
          tocan. Es la <strong>poda de particiones</strong> (<em>partition pruning</em>), y es el premio de haber
          particionado por mes.</li>
        <li><strong>PartitionFilters</strong>: el filtro que permitió esa poda.</li>
        <li><strong>ReadSchema</strong>: de las {{CIFRA:columnas_parquet}} columnas que guardan los archivos, solo lee <code>ciudad</code> y
          <code>total</code>.
          Parquet lo permite porque guarda cada columna por separado.</li>
      </ul>
      <p>Con cientos de gigabytes, la diferencia entre leer todo y leer un mes y dos columnas es la diferencia entre
        una consulta de horas y una de segundos, y en la nube, entre una factura grande y una pequeña.</p>
