      <h3>Consistencia</h3>
      <p>El diccionario <code>CIUDAD_CANONICA</code> de la sesión 1 se convierte en un <strong>mapa</strong> de Spark.
        Antes de aplicarlo, contamos las grafías que no tendrían regla: si apareciera una nueva, como
        «Medellín D.E.», debe saltar a la vista y no convertirse en «Sin dato» sin que nadie lo note.</p>
      {{CELDA:sp_texto}}

      <h3>Validez: un cambio importante de Spark 4</h3>
      <p>En pandas usamos <code>errors="coerce"</code>: lo que no encaja se vuelve nulo. Spark 4 trabaja por defecto en
        <strong>modo ANSI</strong>, el comportamiento del estándar SQL: un valor que no se puede convertir es un
        error.</p>
      {{CELDA:sp_ansi}}
      <p>Es una decisión de calidad: el motor prefiere detenerse a inventar un nulo. Cuando el nulo sí es lo que
        queremos —para contar lo que no se pudo convertir, o para probar un segundo formato—, se pide explícitamente
        con las funciones <code>try_</code> (<code>try_cast</code>, <code>try_to_timestamp</code>).</p>
