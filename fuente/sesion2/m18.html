      <h3>Glosario de la sesión</h3>
      <p>Los términos nuevos de la sesión 2, en el orden en que aparecen, con su equivalente en inglés. Los de la sesión
        1 —HDFS, bloque, shuffle, combiner, calidad del dato— siguen valiendo.</p>
      <table>
        <caption class="sr-only">Glosario de la sesión 2</caption>
        <thead>
          <tr>
            <th scope="col">Término</th>
            <th scope="col">Significado</th>
          </tr>
        </thead>
        <tbody>
          <tr><td><strong>Modo pseudodistribuido</strong> (<em>pseudo-distributed mode</em>)</td><td>Todos los servicios de Hadoop —NameNode, DataNode…— en una sola máquina, como procesos separados.</td></tr>
          <tr><td><strong>Integridad / autenticidad</strong> (<em>integrity / authenticity</em>)</td><td>El archivo llegó sin alteraciones, lo que se comprueba con su huella / lo publicó quien dice publicarlo, lo que se comprueba con su firma digital (los archivos <code>.asc</code> de Apache).</td></tr>
          <tr><td><strong>Huella criptográfica</strong> (<em>cryptographic hash</em>)</td><td>Resumen de tamaño fijo —SHA-512, SHA-256— que cambia por completo si cambia un solo byte. Sirve para verificar integridad; para seudonimizar se calcula junto con un secreto (ver <em>sal</em>), porque el hash de un identificador conocido cualquiera lo puede recalcular.</td></tr>
          <tr><td><strong>Hadoop Streaming</strong></td><td>Modo de Hadoop que usa como mapper y reducer cualquier programa que lea líneas por la entrada estándar y escriba pares clave–valor por la salida estándar.</td></tr>
          <tr><td><strong>Job, tarea, split</strong> (<em>job, task, input split</em>)</td><td>Un job es un trabajo completo enviado al clúster; se divide en tareas. En Hadoop hay una tarea map por split de entrada —«number of splits: 4» son cuatro mappers— y una por reducer; en Spark, cada acción dispara un job y hay una tarea por partición.</td></tr>
          <tr><td><strong>Contadores</strong> (<em>counters</em>)</td><td>Estadísticas que Hadoop registra de cada job: registros leídos, emitidos, bytes del shuffle…</td></tr>
          <tr><td><strong>Driver / ejecutor</strong> (<em>driver / executor</em>)</td><td>El proceso que planifica una aplicación de Spark / los procesos que ejecutan sus tareas.</td></tr>
          <tr><td><strong>Partición (en memoria)</strong> (<em>partition</em>)</td><td>Trozo de un RDD o DataFrame que procesa una tarea; es la unidad de paralelismo de Spark. No confundir con la partición de una tabla (bloque 4).</td></tr>
          <tr><td><strong>RDD</strong></td><td><em>Resilient Distributed Dataset</em>: colección distribuida que se puede recalcular a partir de su linaje.</td></tr>
          <tr><td><strong>Linaje</strong> (<em>lineage</em>)</td><td>La receta de transformaciones con que Spark obtuvo un resultado; si se pierde una partición, la recalcula a partir de ella.</td></tr>
          <tr><td><strong>Transformación / acción</strong> (<em>transformation / action</em>)</td><td>Operación que anota un paso / operación que obliga a ejecutar.</td></tr>
          <tr><td><strong>Ejecución perezosa</strong> (<em>lazy evaluation</em>)</td><td>Spark no calcula nada hasta que una acción lo exige.</td></tr>
          <tr><td><strong>Dependencia angosta / ancha</strong> (<em>narrow / wide dependency</em>)</td><td>Transformación que trabaja dentro de cada partición (<code>filter</code>, <code>map</code>) / que necesita datos de todas y por eso exige un shuffle (<code>reduceByKey</code>, <code>join</code>, <code>groupBy</code>).</td></tr>
          <tr><td><strong>DAG, etapa</strong> (<em>directed acyclic graph, stage</em>)</td><td>Grafo acíclico dirigido con los pasos de un job; Spark lo parte en etapas en cada dependencia ancha, es decir, en cada shuffle.</td></tr>
          <tr><td><strong>Caché</strong> (<em>cache</em>)</td><td>Guardar en memoria un resultado intermedio para que varias acciones no lo recalculen desde el origen.</td></tr>
          <tr><td><strong>DataFrame</strong> (Spark)</td><td>Tabla distribuida e inmutable, con esquema, cuyo plan optimiza Spark. Se parece al de pandas, pero está repartida en particiones.</td></tr>
          <tr><td><strong>Esquema</strong> (<em>schema</em>)</td><td>Columnas y tipos que deben cumplir los datos: un contrato. En Spark SQL, «esquema» también se usa como sinónimo de base de datos.</td></tr>
          <tr><td><strong>Modos de lectura</strong> (<em>read modes</em>)</td><td>Qué hace Spark con una fila que no cumple el esquema: <code>PERMISSIVE</code> la conserva con nulos, <code>DROPMALFORMED</code> la descarta sin avisar, <code>FAILFAST</code> detiene la lectura.</td></tr>
          <tr><td><strong>Modo ANSI</strong> (<em>ANSI mode</em>)</td><td>Comportamiento estándar de SQL, activo por defecto desde Spark 4: una conversión inválida es un error, no un nulo. Las funciones <code>try_</code> devuelven nulo a propósito.</td></tr>
          <tr><td><strong>Bronce, plata, oro</strong> (<em>bronze, silver, gold</em>)</td><td>Capas de la llamada arquitectura «medallón»: los datos tal como llegaron, limpios y validados, y listos para el negocio.</td></tr>
          <tr><td><strong>Join de difusión</strong> (<em>broadcast join</em>)</td><td>Unión en la que la tabla pequeña se copia a cada ejecutor, para no hacer shuffle de la grande.</td></tr>
          <tr><td><strong>Función de ventana</strong> (<em>window function</em>)</td><td>Cálculo por grupo que conserva las filas —un ranking, un acumulado—; el grupo se define con <code>PARTITION BY</code> y el orden con <code>ORDER BY</code>.</td></tr>
          <tr><td><strong>Dato semiestructurado, JSON Lines</strong> (<em>semi-structured data, JSON Lines</em>)</td><td>Cada registro nombra sus campos, que pueden faltar o venir anidados (<em>struct</em>). En un archivo JSON Lines (<code>.jsonl</code>) hay un objeto JSON por línea.</td></tr>
          <tr><td><strong>Catálogo</strong> (<em>metastore</em>)</td><td>Registro de bases de datos, tablas, columnas y ubicación de sus archivos.</td></tr>
          <tr><td><strong>Lago de datos / lakehouse</strong> (<em>data lake / lakehouse</em>)</td><td>Archivos abiertos, como Parquet, más un catálogo que les da forma de tablas / un lago al que se agregan transacciones, historial de versiones y control de cambios (Delta Lake, Apache Iceberg).</td></tr>
          <tr><td><strong>Tabla de hechos / dimensión</strong> (<em>fact / dimension table</em>)</td><td>Una fila por evento medible, con llaves y medidas (<code>ventas</code>) / los atributos descriptivos de una entidad (<code>productos</code>). Juntas forman un modelo en estrella (<em>star schema</em>).</td></tr>
          <tr><td><strong>Tabla administrada / externa</strong> (<em>managed / external table</em>)</td><td>Sus archivos los maneja Spark y <code>DROP TABLE</code> los borra / solo apunta a archivos de otros, que <code>DROP TABLE</code> no toca.</td></tr>
          <tr><td><strong>DDL</strong> (<em>data definition language</em>)</td><td>Parte de SQL que define estructuras: <code>CREATE</code>, <code>ALTER</code>, <code>DROP</code>.</td></tr>
          <tr><td><strong>Parquet</strong></td><td>Formato de archivo abierto, columnar y comprimido: guarda cada columna junta, con su esquema, y permite leer solo las columnas necesarias.</td></tr>
          <tr><td><strong>Partición de tabla</strong> (<em>table partition</em>)</td><td>Carpeta con las filas que comparten el valor de una columna —<code>mes=2025-06</code>—, creada con <code>partitionBy</code>.</td></tr>
          <tr><td><strong>Modos de escritura</strong> (<em>save modes</em>)</td><td>Qué hace Spark si la tabla ya existe: <code>overwrite</code> la reemplaza, <code>append</code> agrega filas, <code>errorifexists</code> falla (por defecto), <code>ignore</code> no hace nada.</td></tr>
          <tr><td><strong>Idempotencia</strong> (<em>idempotency</em>)</td><td>Ejecutar una o varias veces deja el mismo resultado.</td></tr>
          <tr><td><strong>Plan de ejecución</strong> (<em>execution plan</em>)</td><td>Los pasos con que Spark va a resolver una consulta; <code>EXPLAIN</code> lo muestra sin ejecutarla.</td></tr>
          <tr><td><strong>Poda de particiones</strong> (<em>partition pruning</em>)</td><td>Leer solo las carpetas (particiones de tabla) que cumplen el filtro.</td></tr>
          <tr><td><strong>CTE</strong> (<em>common table expression</em>)</td><td>Consulta intermedia con nombre (<code>WITH … AS</code>) que se usa como si fuera una tabla.</td></tr>
          <tr><td><strong>Seudonimización</strong> (<em>pseudonymisation</em>)</td><td>Reemplazar un identificador por un código que no revela la identidad sin una información adicional guardada aparte. Los datos seudonimizados siguen siendo datos personales.</td></tr>
          <tr><td><strong>Sal</strong> (<em>salt</em>)</td><td>Valor que se une al identificador antes de calcular el hash. Si es secreto y se guarda fuera del código y de los datos, nadie puede recalcular el seudónimo; en rigor funciona entonces como una clave, y la práctica recomendada es un hash con clave (HMAC).</td></tr>
          <tr><td><strong>Anonimización</strong> (<em>anonymisation</em>)</td><td>Transformar los datos de forma irreversible para que la persona ya no sea identificable; solo así dejan de ser datos personales.</td></tr>
          <tr><td><strong>Correlación de Pearson</strong> (<em>Pearson correlation</em>)</td><td>Grado en que dos variables varían juntas en línea recta, de −1 a +1. No dice cuál causa a cuál.</td></tr>
        </tbody>
      </table>
