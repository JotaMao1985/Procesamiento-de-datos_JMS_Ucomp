      <h3>El job</h3>
      <p>Hadoop está escrito en Java. Su modo <strong>Streaming</strong> lanza nuestros programas de Python como
        procesos aparte y se comunica con ellos por texto: les pasa las líneas de su bloque por la entrada estándar y
        recoge los pares <code>clave&lt;TAB&gt;valor</code> que escriben en la salida estándar.</p>
      {{CELDA:streaming_job}}

      <p>Los <strong>contadores</strong> son el informe que Hadoop deja de cada job, y conviene leerlos siempre:</p>
      <ul>
        <li><strong>Map input records = {{CIFRA:map_input}}</strong>: las líneas leídas, incluido el encabezado.</li>
        <li><strong>Map output records = {{CIFRA:map_output}}</strong>: los pares que emitió el mapper, uno por venta
          limpia. El encabezado no emitió nada.</li>
        <li><strong>Reduce input groups = {{CIFRA:reduce_grupos}}</strong>: las claves distintas que recibió el reducer,
          las seis ciudades y «Sin dato».</li>
      </ul>
      <p>El resultado queda en HDFS como un archivo por reducer (<code>part-00000</code>,
        <code>part-00001</code>…), junto a un archivo vacío
        <code>_SUCCESS</code> que marca que el job terminó bien. Otros programas pueden esperar a que aparezca
        <code>_SUCCESS</code> antes de leer.</p>

      <h3>Control de coherencia: Hadoop contra pandas</h3>
      {{CELDA:streaming_verifica}}
      <p>Diferencia cero en las siete ciudades. Hadoop no «sabe» que el resultado es correcto: lo sabemos nosotros
        porque lo comparamos con un camino independiente. Es el control de coherencia del criterio CR3.</p>

      <h3>Cuatro mappers, dos reducers y el combiner</h3>
      <p>Hadoop lanza una tarea map por cada <em>split</em> de la entrada: un archivo pequeño es un split, y uno grande
        aporta, por lo general, uno por bloque. Para tener varios mappers, partimos los datos en cuatro archivos, como
        los cuatro bloques de la sesión 1. Sin YARN, el ejecutor local corre esas cuatro tareas una tras otra en un solo
        proceso; en un clúster correrían a la vez, cada una en el nodo que guarda sus datos.</p>
      {{CELDA:streaming_partes}}
      <p>Y ejecutamos el mismo job dos veces, con dos reducers (<code>-D mapreduce.job.reduces=2</code>): primero sin
        combiner y después usando el propio <code>reducer.py</code> como combiner. Sirve por dos razones: sumar es
        asociativo y conmutativo —da igual sumar por partes y en cualquier orden—, y <code>reducer.py</code> escribe lo
        mismo que lee, <code>clave&lt;TAB&gt;valor</code>. Hadoop puede aplicar el combiner cero, una o varias veces,
        así que solo vale si no cambia el resultado. Para no escribir dos veces la orden larga, la celda define una
        función de bash, <code>ejecutar</code>: recibe el nombre del job y, en la segunda llamada, la opción
        <code>-combiner</code>.</p>
      {{CELDA:streaming_combiner}}
