      <h3>Unir con el catálogo: el join de difusión</h3>
      <p>Para unir dos tablas por una llave, Spark normalmente tiene que reunir en el mismo ejecutor las filas que
        comparten llave: un shuffle de las dos tablas. Pero si una de ellas es pequeña, como el catálogo de
        {{CIFRA:productos}} productos, es más barato <strong>difundirla</strong>: mandar una copia completa a cada
        ejecutor y unir ahí mismo, sin mover la tabla grande. Spark lo hace por su cuenta cuando estima que una tabla
        pesa menos de 10 MB (<code>spark.sql.autoBroadcastJoinThreshold</code>); <code>F.broadcast</code> lo pide de
        forma explícita y deja la intención escrita en el código.</p>
      {{CELDA:sp_union}}

      <h3>Dividir, aplicar, combinar</h3>
      {{CELDA:sp_ciudad}}
      <p>La tabla de la sesión 1, ahora calculada por Spark. Detrás de este <code>groupBy</code> hay un MapReduce:
        sumas parciales en cada partición, un shuffle por ciudad y sumas finales.</p>

      <h3>Funciones de ventana</h3>
      <p>Un <code>groupBy</code> colapsa cada grupo en una fila. Una <strong>ventana</strong> calcula algo
        <em>dentro</em> de cada grupo pero conserva las filas: un ranking, un acumulado, la diferencia con el mes
        anterior. Aquí, los dos productos más vendidos de cada categoría:</p>
      {{CELDA:sp_ventana}}
      <p><code>partitionBy("categoria")</code> define los grupos; <code>orderBy</code>, el orden dentro de cada uno; y
        <code>row_number()</code> numera. El segundo criterio de orden, <code>"nombre"</code>, desempata: sin él, dos
        productos con las mismas unidades podrían cambiar de puesto entre una ejecución y otra.</p>

      <h3>Tabla dinámica</h3>

        columnas y le ahorra a Spark un recorrido de los datos para descubrirlos.</p>
