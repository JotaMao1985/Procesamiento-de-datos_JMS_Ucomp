      <p>Un RDD no sabe qué hay dentro de sus objetos: para Spark son cajas cerradas que le entregamos a una función
        de Python. Un <strong>DataFrame</strong> es una tabla distribuida con <strong>esquema</strong> —columnas con
        nombre y tipo—, como el de pandas pero repartido en particiones. Como Spark sabe qué columnas hay y qué se
        quiere hacer con ellas, su optimizador (<em>Catalyst</em>) reescribe el plan, y el trabajo pesado corre dentro
        de Java sin pasar por Python. Por eso, desde Python, los DataFrames son mucho más rápidos que los RDD, y son la
        forma recomendada de usar Spark.</p>

      <p>Registrado como <strong>vista temporal</strong>, un DataFrame se consulta con SQL. No es una copia: SQL y
        Python son dos formas de pedirle trabajo al mismo motor, y para la misma pregunta Catalyst produce el mismo plan.
        Aquí preguntamos por ciudad:</p>
      {{CELDA:df_sql}}
      <p>La suciedad de la ciudad también sigue ahí: «Bogotá D.C.» y «bogota» son la misma Bogotá.</p>

      <h3>Spark lee de HDFS</h3>
      <p>Para cerrar el círculo con el bloque 1: el archivo que subimos a nuestro HDFS se lee con la misma función,
        cambiando la ruta.</p>
      {{CELDA:df_hdfs}}
      <p>El almacenamiento es de Hadoop; el procesamiento, de Spark. En HDFS, <code>ventas.csv</code> ocupa
        {{CIFRA:bloques_ventas}} bloques, pero Spark lo leyó en {{CIFRA:particiones_hdfs}} partición: con
        {{CIFRA:bytes_ventas}} bytes no vale la pena repartirlo más. En un clúster real, Spark además intentaría
        ejecutar cada tarea en el DataNode que tiene el bloque, igual que MapReduce.</p>

      <p>Una diferencia de fondo: los DataFrames de Spark son <strong>inmutables</strong>. No se modifica una columna
        «en su lugar»; cada operación devuelve un DataFrame nuevo, que se vuelve a asignar.</p>
