        <p class="leyenda-diagrama">El driver piensa; los ejecutores trabajan. En Colab, con <code>local[*]</code>,

      <ul>
        <li>El <strong>driver</strong> ejecuta tu programa: convierte cada operación en un plan, lo parte en
          <em>etapas</em> (módulo 8) y cada etapa en <em>tareas</em>, las reparte y recibe los resultados de las
          acciones; por eso <code>collect()</code> o <code>toPandas()</code> traen los datos al driver.</li>
        <li>El <strong>gestor del clúster</strong> asigna máquinas y memoria.</li>
        <li>Los <strong>ejecutores</strong> son procesos en los nodos de trabajo: corren las tareas y pueden guardar
          datos en memoria (caché) para reutilizarlos.</li>
      </ul>

      <h3>Particiones: la unidad de paralelismo</h3>
      <p>Spark reparte cada conjunto de datos en <strong>particiones</strong> y lanza una tarea por partición: son el
        equivalente de los <em>splits</em> que MapReduce entrega a cada mapper. No son los bloques de HDFS: el bloque es
        cómo se guarda el archivo en disco; la partición, cómo se reparte el trabajo entre las tareas. La estructura más básica de Spark es el <strong>RDD</strong> (<em>Resilient
          Distributed Dataset</em>): una colección de objetos repartida en particiones, que se puede recalcular si se
        pierde una.</p>
      {{CELDA:rdd_particiones}}

      <div class="simulador" data-simulador="particiones">
        <h4><i class="fas fa-bars-progress" aria-hidden="true"></i> ¿Cuántas particiones?</h4>
        <p class="simulador-intro">Cada núcleo ejecuta una tarea a la vez; las tareas que no caben esperan su turno, en
          «oleadas». Cada tarea paga además un costo fijo —planificarla, enviarle el código, abrir su trozo de archivo—;
          en Spark real es de centésimas a décimas de segundo. El eje de tiempo queda fijo: mueve los controles y mira
          cómo se ocupan los núcleos y cuánto se acorta el trabajo.</p>
        <div class="simulador-controles"></div>
        <div class="gantt" aria-live="polite"></div>
        <div class="simulador-lectura"></div>
      </div>

      <div class="note">
        <p style="margin-bottom:0;"><strong>Qué mirar en el simulador.</strong> Con menos particiones que núcleos, hay
          núcleos ociosos. Con un número de particiones que no es múltiplo de los núcleos, la última oleada queda a
          medias. Con miles de particiones diminutas, el costo de arranque se come la ganancia. La guía de ajuste de
          Spark recomienda dos o tres tareas por núcleo; al leer archivos, Spark arma por defecto particiones de hasta
          128 MB.</p>
      </div>
