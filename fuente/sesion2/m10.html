      <p>Adivinar los tipos (<code>inferSchema</code>) es cómodo para explorar, pero en un proceso que corre cada noche
        tiene dos problemas: obliga a leer los datos una vez de más, y el resultado cambia si cambian los datos. Un
        día llega un precio con «$» y la columna entera pasa a texto sin que nadie se entere. La alternativa es
        <strong>declarar el esquema</strong>: un contrato que dice qué columnas y qué tipos se esperan.</p>

      {{CELDA:esquema_estricto}}
      <p>{{CIFRA:corruptos}} filas no cumplen el contrato, todas por el mismo motivo: un precio escrito como texto. Con
        la columna <code>_corrupt_record</code>, Spark guarda la línea original tal cual: nada se pierde y cada fila
        problemática queda identificada.</p>

      <h3>¿Qué hacer con una fila que no cumple?</h3>
      <p>Spark ofrece tres políticas, y la elección es una decisión de calidad, no un detalle técnico. <strong>Antes de
          ejecutar:</strong> ¿cuántas filas crees que dejará cada modo, sabiendo que {{CIFRA:corruptos}} filas no cumplen
        el esquema? Anótalo y compara.</p>
      {{CELDA:modos}}

      <table>
        <caption class="sr-only">Modos de lectura de Spark y sus consecuencias</caption>
        <thead>
          <tr>
            <th scope="col">Modo</th>
            <th scope="col">Qué hace con la fila</th>
            <th scope="col">El riesgo</th>
          </tr>
        </thead>
        <tbody>
          <tr><td><code>PERMISSIVE</code> (por defecto)</td><td>La conserva y pone nulo en el campo que no encaja</td>
            <td>Nulos que parecen «dato faltante» cuando en realidad había un dato mal escrito</td></tr>
          <tr><td><code>DROPMALFORMED</code></td><td>La descarta</td>
            <td>Pierde {{CIFRA:corruptos}} ventas reales sin avisar: el total queda subestimado</td></tr>
          <tr><td><code>FAILFAST</code></td><td>Detiene todo con un error</td>
            <td>Ninguno para la calidad, pero un solo registro malo frena el proceso completo</td></tr>
        </tbody>
      </table>

      <div class="warning">
        <h4><i class="fas fa-triangle-exclamation mr-2" aria-hidden="true"></i>Una trampa: <code>count()</code> no
          revisa las columnas</h4>
        <p style="margin-bottom:0;">Para contar filas, Spark no necesita interpretar ninguna columna, así que se las
          salta: la última línea de la celda lo muestra, y sin el <code>cache()</code> los tres modos habrían contado
          {{CIFRA:filas_crudas}} filas y <code>FAILFAST</code> no habría fallado. Es el optimizador aprovechando la
          ejecución perezosa del módulo 8: como ve el plan completo antes de leer, descarta el trabajo que nadie pidió
          —aquí, interpretar las columnas— y con él la validación. Para validar, hay que forzar la lectura de todas las
          columnas.</p>
      </div>

      <h3>La arquitectura por capas: bronce, plata y oro</h3>
      <p>¿Entonces cuál usar? Una práctica muy extendida separa la responsabilidad en capas, y así ninguna política
