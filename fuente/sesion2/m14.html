      <p>Hasta ahora, cada resultado vivía en una variable de Python que desaparece al cerrar Colab. Una
        <strong>base de datos</strong> les da nombre, estructura y permanencia, y permite que cualquiera los consulte
        con SQL sin conocer el código que los produjo.</p>

      <h3>Catálogo y almacenamiento</h3>
      <p>En Spark, una base de datos tiene dos partes, como HDFS tenía NameNode y DataNodes:</p>
      <div class="rejilla-tarjetas">
        <div class="tarjeta">
          <span class="tarjeta-etiqueta">Catálogo</span>
          <p class="tarjeta-titulo"><i class="fas fa-book" aria-hidden="true"></i>Lo que existe</p>
          <p>Nombres de bases de datos y tablas, columnas, tipos, comentarios y dónde están los archivos. En producción
            lo guarda un servicio aparte —Hive Metastore, AWS Glue Data Catalog, Unity Catalog— para que lo compartan
            muchos usuarios y herramientas.</p>
        </div>
        <div class="tarjeta">
          <span class="tarjeta-etiqueta">Almacenamiento</span>
          <p class="tarjeta-titulo"><i class="fas fa-hard-drive" aria-hidden="true"></i>Los datos</p>
          <p>Archivos —normalmente Parquet— en una carpeta: en Colab, <code>spark-warehouse/</code>; en un clúster,
            HDFS o el almacenamiento de objetos de la nube.</p>
        </div>
      </div>
      <p>Esta combinación —archivos abiertos más un catálogo que les da forma de tablas— es la base de un lago de
        datos que se consulta con SQL. Cuando además se agregan transacciones, historial de versiones y control de
        cambios con formatos como Delta Lake o Apache Iceberg, se habla de <em>lakehouse</em>: la escala de un lago de
        datos con la disciplina de una base de datos.</p>

      <h3>Crear la base de datos</h3>
      {{CELDA:bd_crear}}
      <p><code>USE guadua</code> hace que las tablas que se nombren sin prefijo se busquen y se creen en
        <code>guadua</code>.</p>

      <h3>Definir una tabla con DDL</h3>
      <p>El lenguaje de definición de datos (DDL) de SQL declara la tabla antes de cargarla: nombre, columnas, tipos,
        comentarios y formato de almacenamiento. Es el mismo contrato que el esquema del módulo 10, ahora guardado en
        el catálogo para todos.</p>
      {{CELDA:bd_ddl}}
