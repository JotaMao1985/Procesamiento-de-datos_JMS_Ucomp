      <p>Recordemos la arquitectura de la sesión 1: el <strong>NameNode</strong> guarda el índice —qué archivos hay,
        en qué bloques se parten y en qué DataNode está cada bloque— y los <strong>DataNodes</strong> guardan los
        bloques. Hoy los tendremos de verdad, como dos procesos de Java en la máquina de Colab.</p>

      <h3>Configurar: dos archivos XML</h3>
      <p>Hadoop se configura con archivos XML de pares nombre → valor. <code>core-site.xml</code> dice dónde está el
        sistema de archivos (<code>hdfs://localhost:9000</code>: el NameNode, en esta misma máquina). En
        <code>hdfs-site.xml</code> van las reglas de HDFS:</p>
      {{CELDA:hdfs_config}}
      <ul>
        <li><code>dfs.replication = 1</code>: con un solo DataNode no hay dónde poner una segunda copia. En un clúster
          real, el valor por defecto es 3.</li>
        <li><code>dfs.namenode.name.dir</code> y <code>dfs.datanode.data.dir</code>: las carpetas del disco local
          donde cada servicio guarda lo suyo. HDFS es un sistema de archivos <em>encima</em> de los discos de cada
          máquina.</li>
        <li><code>min-block-size</code>: HDFS prohíbe bloques de menos de 1 MB. Lo bajamos a 64 KB solo para ver
          bloques con archivos pequeños; en producción no se toca.</li>
      </ul>

      <h3>Arrancar los servicios</h3>
      <p>Formatear crea un HDFS vacío —como formatear un disco nuevo, se hace una sola vez—. Después se arrancan el
        NameNode y el DataNode en segundo plano y se espera a que el DataNode «se reporte» ante el NameNode.
        <code>jps</code> lista los procesos de Java en marcha. La celda revisa antes qué ya está hecho, así que se
        puede volver a ejecutar sin dañar nada.</p>

      <h3>Cargar los datos del caso</h3>
      <p>Las órdenes de HDFS imitan a las de Linux, con el prefijo <code>hdfs dfs</code>. Creamos una zona
        <code>crudo</code> para los archivos tal como llegaron y otra <code>limpio</code> para lo procesado. El archivo
        de ventas lo subimos con bloques de 64 KB para ver cómo se parte. La opción <code>-f</code> reemplaza el archivo
        si ya existía. Es la ingesta por lotes del módulo 9 de la sesión 1, en su forma más simple.</p>
      {{CELDA:hdfs_subir}}
      <p>Las dos columnas de <code>-du</code> son el tamaño del archivo y el espacio que ocupa en el clúster contando
        las réplicas. Aquí coinciden porque la replicación es 1; con replicación 3, la segunda columna sería el
        triple.</p>

      <h3>Bloques y réplicas, ahora de verdad</h3>
      {{CELDA:hdfs_bloques}}
      <p><code>ventas.csv</code> pesa {{CIFRA:bytes_ventas}} bytes y se guardó con bloques de 65.536 bytes (64 KB): son
        {{CIFRA:bloques_ventas}} bloques, el último de apenas {{CIFRA:ultimo_bloque}} bytes. Un bloque no ocupa el
        tamaño máximo si el archivo no lo llena. Los otros dos archivos usaron el bloque por defecto de 128 MB
        (134.217.728 bytes) y caben en uno solo. Es la misma cuenta que hacía el simulador de la sesión 1.</p>
      <p>El NameNode sabe dónde está cada bloque. La herramienta <code>fsck</code> («revisar el sistema de archivos»)
        se lo pregunta:</p>
      {{CELDA:hdfs_fsck}}
      <p>Cada bloque tiene un identificador (<code>blk_…</code>), su tamaño y la dirección del DataNode que lo guarda.
        El estado <code>HEALTHY</code> significa que no falta ni está dañado ningún bloque: cada uno conserva al menos
        una copia sana.</p>

      <h3>Permisos: un primer control de acceso</h3>
      {{CELDA:hdfs_permisos}}
      <p>Igual que en Linux: <code>rwx</code> para el dueño, <code>r-x</code> para su grupo y nada para los demás. El
        750 se lee cifra por cifra: 7 = 4 + 2 + 1 = <code>rwx</code> (leer, escribir, entrar) para el dueño; 5 = 4 + 1 =
        <code>r-x</code> para el grupo; 0 = nada para los demás. En un clúster real, el dueño sería una cuenta de
        servicio y el grupo, el del equipo de datos (<code>hdfs dfs -chown -R etl:datos /guadua/crudo</code>): así los
        datos crudos —que incluyen el identificador de cada cliente— quedan cerrados para quien no sea de ese equipo.
        Aquí no lo notarás: <code>root</code> arrancó el NameNode y por eso es el superusuario de HDFS, y
        <code>supergroup</code> es el grupo de superusuarios; a ellos los permisos no los detienen.</p>

      <div class="warning">
        <h4><i class="fas fa-triangle-exclamation mr-2" aria-hidden="true"></i>Un permiso no es seguridad si no se sabe
          quién pide</h4>
        <p style="margin-bottom:0;">Por defecto, HDFS usa autenticación <em>simple</em>: cree el nombre de usuario que
          declara el cliente. Cualquiera con acceso a la red podría decir «soy root». En producción, un clúster con datos
          personales necesita <strong>Kerberos</strong> para autenticar, una herramienta como <strong>Apache
            Ranger</strong> para autorizar por tabla y columna, <strong>cifrado</strong> en disco (zonas cifradas) y en
          la red (TLS), y registros de auditoría. Son medidas técnicas con las que se cumple el principio de seguridad
          de la Ley 1581 de 2012 (artículo 4, literal g): proteger los registros contra consulta, uso o acceso no
          autorizado.</p>
      </div>
