        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">Hadoop en Colab: instalar y

            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Distinguir los modos en que se ejecuta Hadoop, instalarlo

          </div>

      <p>Hadoop es un programa de Java que se descarga como un archivo comprimido. No necesita un clúster para
        funcionar: el mismo software corre en tres modos, y la diferencia está solo en la configuración.</p>

      <table>
        <caption class="sr-only">Modos de ejecución de Hadoop</caption>
        <thead>
          <tr>
            <th scope="col">Modo</th>
            <th scope="col">Qué corre y dónde</th>
            <th scope="col">Para qué sirve</th>
          </tr>
        </thead>
        <tbody>
          <tr><td><strong>Local</strong> (<em>standalone</em>)</td><td>Un solo proceso de Java, sin servicios; lee y
              escribe en el disco local.</td><td>Probar un job rápido.</td></tr>
          <tr><td><strong>Pseudodistribuido</strong></td><td>Cada servicio —NameNode, DataNode y, si se quiere, los de
              YARN— como un proceso de Java separado, en <em>una</em> máquina.</td><td>Aprender y probar con las mismas
              órdenes de un clúster. <strong>Es el que usaremos hoy para HDFS.</strong></td></tr>
          <tr><td><strong>Totalmente distribuido</strong></td><td>Los servicios repartidos en muchas máquinas: un
              NameNode y decenas o miles de DataNodes.</td><td>Producción. En la nube, un clúster gestionado como
              Amazon EMR o Google Cloud Dataproc.</td></tr>
        </tbody>
      </table>

      <p>Hoy arrancaremos solo HDFS (NameNode y DataNode). Los trabajos de MapReduce no pasarán por YARN: los
        ejecutará el ejecutor local de Hadoop, que corre las tareas en esta máquina leyendo de HDFS, como propone la
        guía oficial para un solo nodo. Las órdenes, los contadores y el resultado son los de un clúster; lo que no
        veremos es a YARN repartiendo contenedores, que conocimos en la sesión 1.</p>

      <h3>Paso 1 · Descargar</h3>
      <p>La celda baja Hadoop {{CIFRA:version_hadoop}} del sitio de la Apache Software Foundation. Si el espejo principal
        no responde —pasa cuando sale una versión nueva y la anterior se muda al archivo histórico—, intenta con el
        segundo.</p>
      {{CELDA:hadoop_descarga}}

      <h3>Paso 2 · Verificar antes de usar</h3>
      <p>Vamos a ejecutar como administrador un programa que bajamos de internet. Si alguien hubiera alterado el
        archivo en el camino, estaríamos instalando su código. Por eso Apache publica, junto a cada descarga, una
        <strong>huella SHA-512</strong>: un resumen de 128 caracteres que cambia por completo si cambia un solo byte
        del archivo. Calculamos la huella de lo que recibimos y la comparamos con la publicada.</p>
      {{CELDA:hadoop_integridad}}
      <p>Si sale <code>False</code> —por ejemplo, porque la descarga se cortó y quedó un archivo a medias—, no sigas:
        borra lo descargado con <code>!rm -f hadoop-*.tar.gz*</code> y vuelve a ejecutar las dos celdas. (La celda de
        descarga baja primero a un archivo <code>.parcial</code> y solo al final le pone su nombre, así que una descarga
        cortada no pasa por completa; aun así, un archivo puede llegar dañado.)</p>

      <div class="definition">
        <h4><i class="fas fa-shield-halved mr-2" aria-hidden="true"></i>Control de seguridad: integridad del software
          (CR1)</h4>
        <p>Antes de que un dato entre a la etapa de procesamiento, la herramienta que lo va a procesar también debe ser
          confiable. La huella garantiza <strong>integridad</strong>: el archivo llegó sin alteraciones. Para garantizar
          además <strong>autenticidad</strong> —que lo publicó Apache y no un impostor que también cambió la huella—,
          Apache firma cada versión con criptografía de clave pública (archivos <code>.asc</code>).</p>
        <p style="margin-bottom:0;">En una empresa, esta verificación la hace un proceso automático antes de aprobar
          cualquier software. Un ataque a la <em>cadena de suministro</em> consiste justamente en colar código
          malicioso en un programa que todos descargan con confianza.</p>
      </div>

      <h3>Paso 3 · Descomprimir y decirle a Hadoop dónde está</h3>
      <p>Hadoop necesita dos <strong>variables de entorno</strong>: <code>JAVA_HOME</code>, dónde está Java, y
        <code>HADOOP_HOME</code>, dónde quedó Hadoop. Las fijamos desde Python con <code>os.environ</code>; las órdenes
        de terminal que lancemos después (con <code>!</code> o <code>%%bash</code>) las heredan.</p>
      {{CELDA:hadoop_instala}}

      <div class="note">
        <p style="margin-bottom:0;"><strong>¿Por qué «root»?</strong> En Colab todo se ejecuta como el usuario
          administrador del sistema (<code>root</code>). Hadoop se niega a arrancar sus servicios como root a menos que
          se le diga explícitamente, porque en un servidor real sería una mala práctica: un servicio con todos los
          privilegios es un blanco valioso. En un clúster de verdad cada servicio corre con su propio usuario
          (<code>hdfs</code>, <code>yarn</code>) y con los permisos mínimos.</p>
      </div>
