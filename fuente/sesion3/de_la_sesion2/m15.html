      <h3>Con SQL: <code>INSERT</code></h3>

      <h3>Con la API: <code>saveAsTable</code>, particionada por mes</h3>
      <p>Las ventas limpias de Spark van a la capa plata. <code>partitionBy("mes")</code> guarda cada mes en su propia
        carpeta; en el módulo 16 veremos por qué eso ahorra trabajo. Ojo con la palabra: esta partición es una carpeta
        en el disco (partición de la tabla), no la partición en memoria del módulo 7 ni la partición de reducers de la
        sesión 1.</p>
      {{CELDA:bd_ventas}}
      {{CELDA:bd_archivos}}
      <p>Seis carpetas, una por mes, y el archivo <code>_SUCCESS</code> que ya conocemos de Hadoop. En el disco, las
        ventas en Parquet ocupan bastante menos que el CSV, aunque traen una columna más (<code>total</code>): Parquet
        guarda cada columna junta y comprimida, y los valores de una misma columna se parecen mucho entre sí. En el
        módulo 17 lo mediremos columna por columna.</p>

      {{CELDA:bd_resto}}
      <p>La cuarentena también va a la base de datos, con el motivo de cada fila: quien revise la calidad puede
        consultarla con SQL sin abrir el notebook.</p>

      <h3>Cargas que se pueden repetir</h3>
      <p>Un proceso de carga se ejecuta muchas veces: cada noche, o de nuevo después de un fallo. Si repetirlo cambia
        el resultado, el proceso es una fuente de errores. <strong>Antes de ejecutar:</strong> si cargas dos veces la
        misma tabla de productos con <code>append</code>, ¿cuántas filas quedan?</p>
      {{CELDA:bd_idempotencia}}

      <div class="definition">
        <h4><i class="fas fa-repeat mr-2" aria-hidden="true"></i>Idempotencia</h4>
        <p style="margin-bottom:0;">Una operación es <strong>idempotente</strong> si ejecutarla una o diez veces deja el
          mismo resultado. Las cargas idempotentes son un control de coherencia en sí mismas: un reintento después de un
          fallo no puede duplicar las ventas. Lo practicamos desde el bloque 1, cuando cada job de Hadoop borraba antes
          su carpeta de salida.</p>
